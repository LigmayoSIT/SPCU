<h1>Petition Forms Page</h1>

<div class="forms-page">
  <form [formGroup]="barangayFormsPage" (ngSubmit)="onSubmit()" novalidate>
    <div class="cardForm">
      <label for="barangayLocation">Barangay:</label>
      <input id="barangayLocation" type="text" formControlName="barangayLocation" placeholder="Name of your Barangay" />
    
      <label for="issueAndConcern">Issue or concern:</label>
      <input id="issueAndConcern" type="text" formControlName="issueAndConcern" placeholder="State your concerns or issues" />

      <label for="placeOfResidence">Place of residence:</label>
      <input id="placeOfResidence" type="text" formControlName="placeOfResidence" placeholder="e.g. Juan Road" />

      <label for="nameOfResident">Name (Optional):</label>
      <input id="nameOfResident" type="text" formControlName="nameOfResident" placeholder="Your name" />
    </div>

    <hr />

    <div class="form-actions">
      <button type="submit" [disabled]="barangayFormsPage.invalid" class="btn-submit">
        {{ editingId() ? 'Confirm Update' : 'Submit' }}
      </button>

      @if (editingId()) {
        <button type="button" (click)="cancelEdit()" class="btn-cancel">Cancel</button>
      }
    </div>
  </form>
</div>
